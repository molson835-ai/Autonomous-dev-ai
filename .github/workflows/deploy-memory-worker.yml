name: Deploy Cloudflare memory Worker

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type DEPLOY to publish the Worker to Production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: autonomous-dev-memory-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_production == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Worker bundle before publishing
        run: npx --yes wrangler@4 deploy --dry-run --config memory/worker/wrangler.jsonc

      - name: Configure least-privilege Worker runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          OWNER_SESSION_SIGNING_SECRET: ${{ secrets.OWNER_SESSION_SIGNING_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN GitHub Actions secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret or repository variable."; exit 1; }
          test -n "$CLOUDFLARE_ANALYTICS_API_TOKEN" || { echo "Missing CLOUDFLARE_ANALYTICS_API_TOKEN GitHub Actions secret."; exit 1; }
          test -n "$OWNER_SESSION_SIGNING_SECRET" || { echo "Missing OWNER_SESSION_SIGNING_SECRET GitHub Actions secret."; exit 1; }
          printf '%s' "$CLOUDFLARE_ANALYTICS_API_TOKEN" | npx --yes wrangler@4 secret put CLOUDFLARE_ANALYTICS_API_TOKEN --config memory/worker/wrangler.jsonc
          printf '%s' "$OWNER_SESSION_SIGNING_SECRET" | npx --yes wrangler@4 secret put OWNER_SESSION_SIGNING_SECRET --config memory/worker/wrangler.jsonc

      - name: Deploy Worker with repository bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN GitHub Actions secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret or repository variable."; exit 1; }
          npx --yes wrangler@4 deploy --config memory/worker/wrangler.jsonc

      - name: Verify public owner-console CORS preflight and fail-closed auth
        shell: bash
        run: |
          set -euo pipefail
          base="https://autonomous-dev-memory.molson835.workers.dev"
          preflight="$(curl --silent --show-error --include --request OPTIONS "$base/v1/owner/tasks" \
            --header 'Origin: https://autonomous-dev-ai.vercel.app' \
            --header 'Access-Control-Request-Method: GET' \
            --header 'Access-Control-Request-Headers: authorization')"
          printf '%s\n' "$preflight"
          grep -q '204' <<<"$preflight"
          grep -qi 'access-control-allow-origin: https://autonomous-dev-ai.vercel.app' <<<"$preflight"
          unauthorized="$(curl --silent --show-error --output /tmp/owner-auth.json --write-out '%{http_code}' \
            "$base/v1/owner/status" \
            --header 'Origin: https://autonomous-dev-ai.vercel.app' \
            --header 'Authorization: Bearer intentionally-wrong-smoke-test-token')"
          test "$unauthorized" = "401" || { cat /tmp/owner-auth.json; echo "Expected 401 with an intentionally wrong token; 503 indicates owner secret is missing or misconfigured."; exit 1; }
          grep -qi 'access-control-allow-origin: https://autonomous-dev-ai.vercel.app' <(curl --silent --show-error --include \
            "$base/v1/owner/status" --header 'Origin: https://autonomous-dev-ai.vercel.app' \
            --header 'Authorization: Bearer intentionally-wrong-smoke-test-token')
          echo "Worker deployment smoke tests passed: CORS preflight is 204 and owner auth fails closed with 401."
