name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build and type-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate official Eve Web Chat scaffold for inspection
        if: (github.event_name == 'workflow_dispatch' && github.ref_name == 'docs/android-web-chat-design') || github.head_ref == 'docs/android-web-chat-design'
        run: npx --no-install eve add channel/web --non-interactive --yes

      - name: Archive generated Web Chat scaffold
        if: github.head_ref == 'docs/android-web-chat-design'
        run: |
          tar -czf /tmp/eve-web-chat-scaffold.tar.gz \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            .

      - name: Upload generated Web Chat scaffold
        if: github.head_ref == 'docs/android-web-chat-design'
        uses: actions/upload-artifact@v4
        with:
          name: eve-web-chat-scaffold
          path: /tmp/eve-web-chat-scaffold.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Build Eve agent
        run: npm run build

      - name: Type-check authored TypeScript
        shell: bash
        run: |
          if find agent -type f -name '*.ts' -print -quit | grep -q .; then
            npm run typecheck
          else
            echo "No TypeScript source files yet; type-check will run when the first agent tool is added."
          fi
