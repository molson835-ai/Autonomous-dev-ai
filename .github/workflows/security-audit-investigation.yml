name: Temporary dependency audit investigation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Report npm audit findings without changing dependencies
        shell: bash
        run: |
          npm audit --json > npm-audit-report.json || true
          node --input-type=commonjs -e '
            const report = require("./npm-audit-report.json");
            console.log("AUDIT SUMMARY");
            console.log(JSON.stringify(report.metadata?.vulnerabilities ?? {}, null, 2));
            console.log("FINDINGS");
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              console.log(JSON.stringify({
                name,
                severity: item.severity,
                isDirect: item.isDirect,
                range: item.range,
                via: item.via.map(v => typeof v === "string" ? v : {
                  title: v.title, url: v.url, range: v.range, severity: v.severity
                }),
                fixAvailable: item.fixAvailable
              }));
            }
          '
